[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teambot"]

[tool.hatch.build]
include = ["src/teambot/**/*.css", "src/teambot/scaffolds/**"]

[project]
name = "teambot"
version = "0.4.1"
description = "CLI wrapper for GitHub Copilot CLI enabling autonomous AI agent teams"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0.0",
  "python-frontmatter>=1.0.0",
  "rich>=13.0.0",
  "github-copilot-sdk==0.1.32",
  "textual>=0.47.0",
  "httpx>=0.27.0",
  "jsonschema>=4.0.0",
]

[dependency-groups]
dev = [
  "ruff>=0.8.0",
  "pytest>=9.0.3",
  "pytest-cov>=4.1.0",
  "pytest-mock>=3.12.0",
  "pytest-asyncio>=0.23.0",
  "textual[dev]>=0.47.0",
  "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
teambot = "teambot.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# AGENT_DIRECTORY_SECTION contains markdown tables that must match the scaffold
"src/teambot/markdown_constants.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src/teambot --cov-report=term-missing -m 'not acceptance'"
asyncio_mode = "auto"
markers = [
    "acceptance: marks tests as acceptance tests (slow, may duplicate CI checks; run with -m acceptance)",
    "slow: marks tests as slow running (run with -m slow)",
]

[tool.uv]
package = true
